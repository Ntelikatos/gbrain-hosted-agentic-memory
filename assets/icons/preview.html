<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gbrain.svg — size check</title>
<style>
  :root { --bg:#fff; --fg:#16161a; --muted:#6b6b76; --line:#e6e6ec; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0d0d11; --fg:#f2f2f5; --muted:#9a9aa6; --line:#26262e; }
  }
  :root[data-theme="dark"] { --bg:#0d0d11; --fg:#f2f2f5; --muted:#9a9aa6; --line:#26262e; }
  * { box-sizing: border-box; }
  body { margin:0; padding:2rem 1.25rem 4rem; background:var(--bg); color:var(--fg);
         font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:1.3rem; margin:0 0 .3rem; letter-spacing:-.02em; }
  p { color:var(--muted); margin:0 0 2rem; font-size:.9rem; max-width:60ch; }
  .ladder { display:flex; gap:1.5rem; align-items:flex-end; flex-wrap:wrap; }
  .step { display:flex; flex-direction:column; align-items:center; gap:.45rem; }
  .chip { display:grid; place-items:center; border-radius:9px; padding:11px; }
  .light { background:#fff; box-shadow:inset 0 0 0 1px var(--line); }
  .dark  { background:#13111C; box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); }
  .px { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:.68rem; color:var(--muted); font-variant-numeric:tabular-nums; }
  .step.target .px { color:#7C5CFF; font-weight:600; }
  img { display:block; }
</style>
<div class="wrap">
  <h1>gbrain.svg</h1>
  <p>The template and service icon, at the sizes Railway renders it. 32&nbsp;px is the service icon on the project canvas &mdash; judge there. Open this file with <code>gbrain.svg</code> alongside it.</p>
  <div class="ladder" id="l"></div>
</div>
<script>
  document.getElementById("l").innerHTML = [128, 64, 48, 32, 16].map(s => `
    <div class="step${s === 32 ? " target" : ""}">
      <div class="chip light"><img src="gbrain.svg" width="${s}" height="${s}" alt="gbrain icon at ${s}px on white"></div>
      <div class="chip dark"><img src="gbrain.svg" width="${s}" height="${s}" alt="gbrain icon at ${s}px on dark"></div>
      <span class="px">${s}px</span>
    </div>`).join("");
</script>
