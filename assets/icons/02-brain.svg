<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GBrain">
  <!-- Right hemisphere: bumpy cortex outline plus two gyri. Mirrored below,
       so the two halves are identical by construction and the icon cannot
       drift out of symmetry. -->
  <g fill="none" stroke="#7C5CFF" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
    <g id="hemisphere">
      <path d="M32 8A6.03 6.03 0 0 1 42 9A5.39 5.39 0 0 1 50.5 13.5A6.32 6.32 0 0 1 56 21A8.15 8.15 0 0 1 57 30A6.18 6.18 0 0 1 53.5 39A5.95 5.95 0 0 1 46 46A6.11 6.11 0 0 1 37 50A3.09 3.09 0 0 1 33 51"/>
      <path d="M35.5 16c7.5 0.5 10 5 8 9" stroke-width="3"/>
      <path d="M36 31c8.5 0.5 11.5 5.5 8.5 10" stroke-width="3"/>
    </g>
    <use href="#hemisphere" transform="translate(64,0) scale(-1,1)"/>
    <!-- Longitudinal fissure. Stops short of the base so the hemispheres
         read as joined there, rather than as a leaf and its stalk. -->
    <path d="M32 8v41"/>
  </g>
</svg>
