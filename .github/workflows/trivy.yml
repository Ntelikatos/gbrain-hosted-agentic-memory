name: Trivy Security Scan

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly, so newly-disclosed CVEs in the base image surface without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: gbrain-hosted-agentic-memory:scan
          cache-from: type=gha

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gbrain-hosted-agentic-memory:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # The SARIF upload is the system of record, but it is only readable from
      # the Security tab. Repeat the same findings as a table in the run summary
      # so a red scan is diagnosable from the run itself.
      - name: Summarize findings
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gbrain-hosted-agentic-memory:scan
          format: table
          output: trivy-results.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Trivy: CRITICAL/HIGH, fixed only'
            echo
            echo '```'
            cat trivy-results.txt 2>/dev/null || echo "no table produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat trivy-results.txt 2>/dev/null || true
